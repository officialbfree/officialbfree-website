<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Page title shown in the browser tab. Safe to edit. -->
  <title>B Free — Official Site</title>
  <meta name="description" content="Official site of B Free. Detroit hip-hop and R&B. Music, merch, booking.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Nav is built automatically from SITE_CONTENT.nav in script.js -->
  <header class="site-header" id="site-header"></header>

  <main id="main">

    <!-- ================================================================
         HERO
         One-pager layout: background video, your name, and the "out
         now" strip below it. The video is a YouTube embed — set the
         video ID in content.json under home.heroYoutubeId and
         script.js builds the muted, looping background automatically.
         The round button in the corner lets a visitor turn the sound
         on with one click.
         ================================================================ -->
    <section class="hero">

      <!-- script.js fills this with a YouTube video once the page loads.
           The image underneath stays visible as a fallback if no video
           ID is set, or for a moment while it loads. Replace
           assets/hero-poster.jpg with a photo of your own using that
           same filename if you want a different fallback image. -->
      <div class="hero-video" id="hero-video">
        <img class="hero-video-poster" src="assets/hero-poster.jpg" alt="">
      </div>

      <div class="hero-overlay" aria-hidden="true"></div>

      <div class="hero-content">
        <h1 class="display hero-title" id="hero-headline"></h1>
      </div>

      <button type="button" id="hero-sound-toggle" class="hero-sound-toggle" aria-pressed="false" aria-label="Unmute background video">
        <span class="hero-sound-icon" id="hero-sound-icon">&#128263;</span>
      </button>
    </section>

    <!-- Scrolling "out now" strip — this is the carousel. Text comes
         from the current single set in SITE_CONTENT.music in script.js. -->
    <a class="marquee" href="music.html" aria-label="Latest release, listen now">
      <div class="marquee-track" id="marquee-track"></div>
    </a>

  </main>

  <!-- Footer is built automatically from SITE_CONTENT.footer in script.js -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="script.js"></script>
</body>
</html>
