<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Page title shown in the browser tab. Safe to edit. -->
  <title>Music — B Free</title>
  <meta name="description" content="B Free's discography — every release, streamable everywhere.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="music">

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Nav is built automatically from SITE_CONTENT.nav in script.js -->
  <header class="site-header" id="site-header"></header>

  <main id="main" class="page">

    <!-- ================================================================
         MUSIC PAGE BACKGROUND VIDEO
         Same pattern as the home page hero: plays a YouTube video on
         loop, muted, behind the page title. Video ID lives in
         content.json under music.heroYoutubeId — swap it any time,
         no code edits needed.
         ================================================================ -->
    <section class="hero hero-music">
      <div class="hero-video" id="hero-video-music">
        <img class="hero-video-poster" src="assets/hero-poster.jpg" alt="" aria-hidden="true">
      </div>

      <div class="hero-overlay" aria-hidden="true"></div>

      <button type="button" class="hero-sound-toggle" id="hero-sound-toggle-music" aria-pressed="false" aria-label="Unmute background video">
        <span class="hero-sound-icon" aria-hidden="true">&#128263;</span>
      </button>

      <header class="page-head reveal">
        <h1 class="display page-title">Music</h1>
      </header>
    </section>

    <!-- ================================================================
         DISCOGRAPHY
         Everything except the current single, newest first, built from
         SITE_CONTENT.music.previousReleases in content.json. When you
         put out something new: move the old "latest release" into an
         object at the top of that array (title, year, type, image, url)
         and update currentSingle/coverImage with the new one.

         The left column is a filter built automatically from each
         release's "type" (Album / Single / etc). Same catalog layout
         used on the Store page.
         ================================================================ -->
    <section class="discography">
      <p class="eyebrow">Discography</p>
      <h2 class="display discography-title">Recent Releases</h2>
      <div class="catalog-layout">
        <aside class="catalog-filters" id="discography-filters" aria-label="Filter releases"></aside>
        <div class="catalog-grid discography-grid" id="discography-grid"></div>
      </div>
    </section>

  </main>

  <!-- Footer is built automatically from SITE_CONTENT.footer in script.js -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="script.js"></script>
</body>
</html>
