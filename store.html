<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Page title shown in the browser tab. Safe to edit. -->
  <title>Store — B Free</title>
  <meta name="description" content="Official B Free merch.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="store">

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Nav is built automatically from SITE_CONTENT.nav in script.js -->
  <header class="site-header" id="site-header"></header>

  <main id="main" class="page">

    <!-- ================================================================
         STORE PAGE BACKGROUND VIDEO
         Same pattern as the Music page: plays a YouTube video on loop,
         muted, behind the page title. Video ID lives in content.json
         under store.heroYoutubeId — swap it any time, no code edits
         needed.
         ================================================================ -->
    <section class="hero hero-music">
      <div class="hero-video" id="hero-video-store">
        <img class="hero-video-poster" src="assets/hero-poster.jpg" alt="" aria-hidden="true">
      </div>

      <div class="hero-overlay" aria-hidden="true"></div>

      <button type="button" class="hero-sound-toggle" id="hero-sound-toggle-store" aria-pressed="false" aria-label="Unmute background video">
        <span class="hero-sound-icon" aria-hidden="true">&#128263;</span>
      </button>

      <header class="page-head reveal">
        <p class="eyebrow">Official merch</p>
        <h1 class="display page-title">Store</h1>
        <p class="page-note">Checkout opens in a new tab through a secure payment page.</p>
      </header>
    </section>

    <!-- ================================================================
         PRODUCT CATALOG
         Left column is a category filter built automatically from the
         "category" field on each product in SITE_CONTENT.store.products.
         Right side is the product grid. Every card is built from that
         same list in script.js — to add, remove, or edit products (or
         their category), edit content.json. Product photos live in
         /assets (product-1.jpg, product-2.jpg...). Buy buttons/links
         stay dimmed until a checkout link is pasted in.
         ================================================================ -->
    <section class="catalog reveal">
      <div class="catalog-layout">
        <aside class="catalog-filters" id="store-filters" aria-label="Filter products"></aside>
        <div class="catalog-grid store-grid" id="product-grid"></div>
      </div>
    </section>

  </main>

  <!-- Footer is built automatically from SITE_CONTENT.footer in script.js -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="script.js"></script>
</body>
</html>
