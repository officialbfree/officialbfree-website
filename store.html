<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Page title shown in the browser tab. Safe to edit. -->
  <title>Store — B Free</title>
  <meta name="description" content="Official B Free merch.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="store">

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Nav is built automatically from SITE_CONTENT.nav in script.js -->
  <header class="site-header" id="site-header"></header>

  <main id="main" class="page">

    <header class="page-head reveal">
      <p class="eyebrow">Official merch</p>
      <h1 class="display page-title">Store</h1>
      <p class="page-note">Checkout opens in a new tab through a secure payment page.</p>
    </header>

    <!-- ================================================================
         PRODUCT GRID
         Every card below is built from SITE_CONTENT.store.products in
         script.js. To add, remove, or edit products, edit that list.
         Product photos live in /assets (product-1.jpg, product-2.jpg...).
         Buy buttons stay dimmed until a checkout link is pasted in.
         ================================================================ -->
    <section class="store-grid" id="product-grid"></section>

  </main>

  <!-- Footer is built automatically from SITE_CONTENT.footer in script.js -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="script.js"></script>
</body>
</html>
