<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Page title shown in the browser tab. Safe to edit. -->
  <title>Contact — B Free</title>
  <meta name="description" content="Get in touch with B Free.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Nav is built automatically from SITE_CONTENT.nav in script.js -->
  <header class="site-header" id="site-header"></header>

  <main id="main" class="page">

    <header class="page-head reveal">
      <p class="eyebrow">Get in touch</p>
      <h1 class="display page-title">Contact</h1>
    </header>

    <!-- ================================================================
         CONTACT FORM
         Powered by Netlify Forms — no backend code required. Submissions
         are emailed to business@menace.media (set as the notification
         address in the Netlify dashboard for this site, under
         Project configuration > Forms > Form notifications). To change
         where submissions go, update the notification there — this
         markup doesn't need to change.
         ================================================================ -->
    <section class="about-section reveal">
      <div class="contact-block">
        <p class="eyebrow">Contact</p>
        <h2 class="display contact-title">Send a message</h2>
        <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="contact-form">
          <input type="hidden" name="form-name" value="contact">
          <p hidden>
            <label>Don't fill this out if you're human: <input name="bot-field"></label>
          </p>

          <div class="contact-row">
            <div class="contact-field">
              <label for="contact-first-name">First Name</label>
              <input type="text" id="contact-first-name" name="First Name" required>
            </div>
            <div class="contact-field">
              <label for="contact-last-name">Last Name</label>
              <input type="text" id="contact-last-name" name="Last Name" required>
            </div>
          </div>

          <div class="contact-field">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="Email" required>
          </div>

          <div class="contact-field">
            <label for="contact-subject">Subject</label>
            <input type="text" id="contact-subject" name="Subject" required>
          </div>

          <div class="contact-field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="Message" rows="5" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary contact-submit">Submit</button>
        </form>
      </div>
    </section>

  </main>

  <!-- Footer is built automatically from SITE_CONTENT.footer in script.js -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="script.js"></script>
</body>
</html>
